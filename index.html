<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoCoach Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--card:#171e29;--card2:#242f3d;--input:#2d3a4c;--text:#f4f7fb;--muted:#aebccc;--blue:#8ec5ff;--gold:#ffd166;--green:#6ee7b7;--red:#ff7777}*{box-sizing:border-box}body{margin:0;font:16px Arial;background:var(--bg);color:var(--text)}header{text-align:center;padding:28px 16px;background:linear-gradient(135deg,#18212d,#2c455d)}main{max-width:980px;margin:auto;padding:16px 16px 70px}.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #0003}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}input,select,button{width:100%;padding:12px;border:0;border-radius:10px;font-size:1rem}input,select{background:var(--input);color:var(--text);margin-top:6px}button{background:#edf2f7;color:#111;font-weight:bold;cursor:pointer;margin-top:10px}.gold{background:linear-gradient(135deg,#ffd166,#e9ab00)}.green{background:var(--green)}.red{background:var(--red);color:#111}.muted,.small{color:var(--muted);font-size:.88rem;line-height:1.5}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge{border-radius:999px;padding:6px 10px;background:#455366;font-size:.78rem}.pro{background:#765c16;color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs button.active{background:var(--blue)}.hidden{display:none}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}@media(max-width:650px){.filters{grid-template-columns:1fr}}.list{max-height:360px;overflow:auto;margin-top:10px}.item{background:var(--card2);padding:12px;border-radius:11px;margin:8px 0}.item button{padding:8px;font-size:.86rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.stat{text-align:center;background:var(--card2);padding:12px;border-radius:10px}.stat b{display:block;font-size:1.15rem;margin-top:5px}.mod{background:var(--card2);padding:12px;border-radius:10px;margin:8px 0}.total{text-align:center;background:var(--card2);padding:14px;border-radius:10px;font-size:1.4rem;font-weight:bold;margin-top:10px}h1{margin:0}h2{margin-top:0}
  </style>
</head>
<body>
<header><h1>🚗 AutoCoach</h1><p class="muted">Simulateur automobile avec compte et abonnement Pro</p></header>
<main>
  <section id="auth" class="card"><h2>👤 Compte</h2><div class="grid"><label>Email<input id="email" type="email" placeholder="toi@exemple.fr"></label><label>Mot de passe<input id="password" type="password" placeholder="Minimum 6 caractères"></label></div><button id="signup">Créer un compte</button><button id="login">Se connecter</button><p id="authMessage" class="small"></p></section>
  <section id="account" class="card hidden"><div class="status"><div>Connecté : <strong id="userEmail"></strong><br><span id="plan" class="badge">FREE</span></div><button id="logout" class="red" style="width:auto">Se déconnecter</button></div><button id="checkout" class="gold">🚀 Passer à AutoCoach Pro — 4,99 €/mois</button><p id="paymentMessage" class="small"></p></section>
  <nav class="tabs"><button class="active" data-page="garage">🔧 Garage</button><button data-page="mods">🛠️ Modifs</button><button data-page="saved">💾 Sauvegardes</button></nav>
  <section id="garage" class="page"><div class="card"><h2>Choisir un modèle</h2><div class="filters"><input id="search" placeholder="Rechercher..."><select id="brand"><option value="">Toutes les marques</option></select><select id="category"><option value="">Toutes catégories</option><option>citadine</option><option>berline</option><option>break</option><option>SUV</option><option>sportive</option><option>GT</option><option>electrique</option><option>utilitaire</option></select></div><p id="count" class="small"></p><div id="cars" class="list"></div></div><div class="card"><h2>Mon véhicule</h2><div class="grid"><label>Nom<input id="carName" placeholder="Toyota Yaris"></label><label>Puissance (ch)<input id="hp" type="number"></label><label>Poids (kg)<input id="weight" type="number"></label><label>0–100 (s)<input id="zero" type="number" step=".1"></label></div><button id="calculate">📊 Calculer</button><button id="save" class="green">💾 Sauvegarder</button><div id="result"></div></div></section>
  <section id="mods" class="page hidden"><div class="card"><h2>🛠️ Préparation</h2><div id="modsList"></div><h3>Ma préparation</h3><div id="cart">Aucune modification.</div><div class="total">Total : <span id="total">0</span> €</div><button id="simulate">🚀 Simuler</button><div id="simulation"></div></div></section>
  <section id="saved" class="page hidden"><div class="card"><h2>💾 Mes garages</h2><div id="garages"></div></div></section>
</main>
<script>
const SUPABASE_URL='__SUPABASE_URL__',SUPABASE_ANON_KEY='__SUPABASE_ANON_KEY__';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);
const models=[['Toyota','Yaris','citadine',100,980,10.7],['Peugeot','208','citadine',100,1065,9.9],['Volkswagen','Golf','berline',130,1260,8.6],['Ford','Focus ST','sportive',280,1385,5.7],['Honda','Civic Type R','sportive',315,1410,5.1],['Renault','Mégane RS','sportive',300,1380,5],['Audi','A3','berline',150,1310,8.4],['Audi','RS3','sportive',400,1545,3.8],['BMW','M3','sportive',510,1680,3.8],['Mercedes','Classe C','berline',184,1460,7.3],['Tesla','Model 3','electrique',283,1815,5.8],['Porsche','911 Carrera','sportive',385,1450,4.2],['Ferrari','Roma','GT',612,1575,3.2],['Nissan','GT-R','sportive',565,1750,2.8],['Toyota','Supra','sportive',382,1465,3.9],['Porsche','Taycan','electrique',408,2140,5.1],['Dacia','Duster','SUV',130,1350,10.6],['Peugeot','3008','SUV',130,1420,8.6],['BMW','X5','SUV',286,2100,5.9],['Volkswagen','ID.4','electrique',204,1895,6.6],['Volvo','XC40','SUV',150,1490,8.4],['Mini','Cooper','citadine',136,1125,7.9],['Kia','EV6','electrique',229,1850,5.2],['Lamborghini','Huracan','sportive',640,1422,3.2],['Citroën','C3','citadine',82,1015,13.4],['Fiat','500','citadine',69,980,14],['Skoda','Octavia','berline',150,1330,8.2],['Seat','Leon','berline',150,1280,8],['Hyundai','Ioniq 5','electrique',225,1837,5.2],['Ford','Mustang','sportive',450,1613,4.3]].map((x,i)=>({id:i+1,brand:x[0],model:x[1],category:x[2],hp:x[3],weight:x[4],zero:x[5]}));
const mods=[['Reprogrammation moteur',450,15,0],['Admission sport',250,5,0],['Échappement sport',600,5,-5],['Pneus performance',500,0,0],['Jantes allégées',800,0,-20],['Freins performance',700,0,-5],['Suspension sport',900,0,-5]].map(x=>({name:x[0],price:x[1],hp:x[2],weight:x[3]}));let selected=[];
function message(id,text){$(id).textContent=text}function current(){return{name:$('carName').value||'Ma voiture',hp:+$('hp').value,weight:+$('weight').value,zero100:+$('zero').value}}function valid(c){return c.hp>0&&c.weight>0&&c.zero100>0}
function renderCars(){let q=$('search').value.toLowerCase(),b=$('brand').value,c=$('category').value;let list=models.filter(x=>(!q||`${x.brand} ${x.model}`.toLowerCase().includes(q))&&(!b||x.brand===b)&&(!c||x.category===c));$('count').textContent=`${list.length} modèle(s)`;$('cars').innerHTML=list.map(x=>`<div class="item"><b>${x.brand} ${x.model}</b><div class="small">${x.category} · ${x.hp} ch · ${x.weight} kg · 0–100 ${x.zero.toFixed(1)} s</div><button data-car="${x.id}">Utiliser ce modèle</button></div>`).join('')||'<p class="small">Aucun modèle.</p>';document.querySelectorAll('[data-car]').forEach(btn=>btn.onclick=()=>load(models.find(x=>x.id==btn.dataset.car)))}
function load(x){$('carName').value=`${x.brand} ${x.model}`;$('hp').value=x.hp;$('weight').value=x.weight;$('zero').value=x.zero;calculate()}
function calculate(){let c=current();if(!valid(c)){message('result','⚠️ Remplis toutes les données.');return}$('result').innerHTML=`<div class="stats"><div class="stat">Puissance<b>${c.hp} ch</b></div><div class="stat">Poids<b>${c.weight} kg</b></div><div class="stat">0–100<b>${c.zero100.toFixed(1)} s</b></div><div class="stat">Poids/ch<b>${(c.weight/c.hp).toFixed(2)}</b></div></div>`}
function renderMods(){$('modsList').innerHTML=mods.map((m,i)=>`<div class="mod"><b>${m.name}</b><p class="small">${m.hp?`+${m.hp} ch`:'Dynamique'} ${m.weight?`· ${Math.abs(m.weight)} kg`:''} · ${m.price} €</p><button data-add="${i}">Ajouter</button></div>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{selected.push(mods[b.dataset.add]);renderCart()})}function renderCart(){if(!selected.length){$('cart').textContent='Aucune modification.';$('total').textContent='0';return}$('total').textContent=selected.reduce((a,x)=>a+x.price,0);$('cart').innerHTML=selected.map((x,i)=>`<div class="mod">${x.name} — ${x.price} €<button class="red" data-remove="${i}">Retirer</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.splice(b.dataset.remove,1);renderCart()})}
function simulate(){let c=current();if(!valid(c)){message('simulation','⚠️ Remplis d’abord le garage.');return}let hp=c.hp+selected.reduce((a,x)=>a+x.hp,0),weight=Math.max(1,c.weight+selected.reduce((a,x)=>a+x.weight,0)),zero=Math.max(2.5,c.zero100*Math.sqrt((weight/hp)/(c.weight/c.hp))),cost=selected.reduce((a,x)=>a+x.price,0);$('simulation').innerHTML=`<div class="stats"><div class="stat">Puissance<b>${hp} ch</b></div><div class="stat">Poids<b>${weight} kg</b></div><div class="stat">0–100 estimé<b>${zero.toFixed(1)} s</b></div><div class="stat">Gain<b>${Math.max(0,c.zero100-zero).toFixed(1)} s</b></div></div><p class="small">Budget : ${cost} €. Simulation théorique.</p>`}
async function session(){let{data}=await client.auth.getSession();update(data.session);client.auth.onAuthStateChange((_e,s)=>update(s))}function update(s){$('auth').classList.toggle('hidden',!!s);$('account').classList.toggle('hidden',!s);if(s){$('userEmail').textContent=s.user.email;loadProfile(s.user.id)} }
async function loadProfile(id){let{data}=await client.from('profiles').select('is_premium').eq('id',id).single();$('plan').textContent=data?.is_premium?'PRO':'FREE';$('plan').className='badge '+(data?.is_premium?'pro':'')}
async function auth(kind){let email=$('email').value,password=$('password').value;if(!email||password.length<6){message('authMessage','Email et mot de passe requis (6 caractères minimum).');return}let r=kind==='signup'?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});message('authMessage',r.error?r.error.message:'Opération réussie. Vérifie ton email si nécessaire.')}
async function checkout(){let{data:{session}}=await client.auth.getSession();if(!session){message('paymentMessage','Connecte-toi d’abord.');return}let r=await client.functions.invoke('create-checkout-session',{body:{return_url:location.href}});if(r.error){message('paymentMessage',r.error.message);return}location.href=r.data.url}
async function save(){let{data:{session}}=await client.auth.getSession(),c=current();if(!session){alert('Connecte-toi pour sauvegarder.');return}if(!valid(c)){alert('Remplis toutes les données.');return}let r=await client.from('garages').insert({user_id:session.user.id,name:c.name,hp:c.hp,weight:c.weight,zero100:c.zero100});if(r.error)alert(r.error.message);else loadGarages()}
async function loadGarages(){let{data:{session}}=await client.auth.getSession();if(!session){$('garages').innerHTML='<p class="small">Connecte-toi pour voir tes sauvegardes.</p>';return}let{data,error}=await client.from('garages').select('*').order('created_at',{ascending:false});if(error){$('garages').textContent=error.message;return}$('garages').innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.name}</b><p class="small">${x.hp} ch · ${x.weight} kg · 0–100 ${Number(x.zero100).toFixed(1)} s</p></div>`).join('')||'<p class="small">Aucune sauvegarde.</p>'}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('hidden',p.id!==b.dataset.page));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.page==='saved')loadGarages()});$('signup').onclick=()=>auth('signup');$('login').onclick=()=>auth('login');$('logout').onclick=()=>client.auth.signOut();$('checkout').onclick=checkout;$('calculate').onclick=calculate;$('save').onclick=save;$('simulate').onclick=simulate;['search','brand','category'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderCars));let brands=[...new Set(models.map(x=>x.brand))].sort();$('brand').innerHTML='<option value="">Toutes les marques</option>'+brands.map(x=>`<option>${x}</option>`).join('');renderCars();renderMods();renderCart();session();
</script>
</body></html>
